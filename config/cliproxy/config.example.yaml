# CLIProxyAPI Configuration Template
# Multi-Agent Orchestration with Codex (GPT) & Antigravity (Gemini)

host: "127.0.0.1"
port: 8317

tls:
  enable: false

# Directory where OAuth credentials (codex-*.json and antigravity-*.json) are persisted
auth-dir: "~/.cli-proxy-api"

# Internal gateway API keys for clients (Codex CLI / AO)
api-keys:
  - "REDACTED_GATEWAY_KEY"

# Routing and load balancing strategy across accounts
routing:
  strategy: "round-robin"
  session-affinity: true
  session-affinity-ttl: "4h"
  session-affinity-subagents: false

# Credential selection, routing & failover policies on rate-limit / 429
request-retry: 3
max-retry-credentials: 0
max-retry-interval: 15

# Strict model identity preservation (prevent automatic fallback to preview/different models)
quota-exceeded:
  switch-preview-model: false

debug: false
